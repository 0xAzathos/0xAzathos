<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Azathos: bug hunter, pentester, red teamer. Open to pentest roles, current focus OSCP.">
  <style>
    /* Palette: matches azathos.com */
    svg {
      --bg: #0D0F12;
      --ink: #E8EAED;
      --muted: #7D838C;
      --line: #FFFFFF;
      --red: #E5484D;
    }

    .bg     { fill: var(--bg); }
    .col    { stroke: var(--line); stroke-opacity: 0.045; stroke-width: 1; }
    .rule   { stroke: var(--line); stroke-opacity: 0.08; stroke-width: 1; }
    .mono   { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace; }
    .label  { fill: var(--muted); font-size: 14px; letter-spacing: 2.5px; }
    .value  { fill: var(--ink); font-size: 17px; }
    .tag    { fill: var(--ink); font-size: 26px; }
    .red    { fill: var(--red); }
    .dot    { fill: var(--red); }
    .spark  { fill: var(--ink); }
    .word   { font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif; font-size: 150px; font-weight: 900; letter-spacing: 4px; fill: #FFFFFF; }

    .twinkle-a { animation: twinkle 3.2s ease-in-out infinite; }
    .twinkle-b { animation: twinkle 3.2s ease-in-out infinite 1.6s; }
    .role      { opacity: 0; animation: role 9s infinite; }
    .role-2    { animation-delay: 3s; }
    .role-3    { animation-delay: 6s; }
    .blink     { animation: blink 1.1s steps(1, end) infinite; }

    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
    @keyframes role    { 0% { opacity: 0; } 3%, 30% { opacity: 1; } 33.3%, 100% { opacity: 0; } }
    @keyframes blink   { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .twinkle-a, .twinkle-b, .blink { animation: none; }
      .role { animation: none; }
      .role-1 { opacity: 1; }
    }
  </style>

  <defs>
    <!-- red LED grid that fills the word -->
    <pattern id="leds" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect class="dot" x="1" y="1" width="4.6" height="4.6" rx="1"/>
    </pattern>

    <!-- two sparse sets of white LEDs that twinkle in turn -->
    <pattern id="sparks-a" width="63" height="49" patternUnits="userSpaceOnUse">
      <rect class="spark" x="1" y="1" width="4.6" height="4.6" rx="1"/>
      <rect class="spark" x="36" y="29" width="4.6" height="4.6" rx="1"/>
    </pattern>
    <pattern id="sparks-b" width="77" height="56" patternUnits="userSpaceOnUse">
      <rect class="spark" x="22" y="15" width="4.6" height="4.6" rx="1"/>
      <rect class="spark" x="57" y="43" width="4.6" height="4.6" rx="1"/>
    </pattern>

    <mask id="word" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="360">
      <text class="word" x="40" y="262">AZATHOS</text>
    </mask>
  </defs>

  <!-- background and column grid -->
  <rect class="bg" width="1200" height="360"/>
  <g>
    <line class="col" x1="40.5"   y1="0" x2="40.5"   y2="360"/>
    <line class="col" x1="200.5"  y1="0" x2="200.5"  y2="360"/>
    <line class="col" x1="360.5"  y1="0" x2="360.5"  y2="360"/>
    <line class="col" x1="520.5"  y1="0" x2="520.5"  y2="360"/>
    <line class="col" x1="680.5"  y1="0" x2="680.5"  y2="360"/>
    <line class="col" x1="840.5"  y1="0" x2="840.5"  y2="360"/>
    <line class="col" x1="1000.5" y1="0" x2="1000.5" y2="360"/>
    <line class="col" x1="1160.5" y1="0" x2="1160.5" y2="360"/>
  </g>

  <!-- file header row -->
  <text class="mono label" x="40"  y="44">01 / FILE</text>
  <text class="mono value" x="40"  y="68">azathos.profile</text>
  <text class="mono label" x="440" y="44">STATUS</text>
  <circle class="red" cx="445" cy="62" r="3.5"/>
  <text class="mono value" x="458" y="68">Open to pentest roles</text>
  <text class="mono label" x="840" y="44">CURRENT FOCUS</text>
  <text class="mono value" x="840" y="68">OSCP</text>
  <line class="rule" x1="40" y1="90.5" x2="1160" y2="90.5"/>

  <!-- dot matrix wordmark -->
  <rect width="1200" height="360" fill="url(#leds)" mask="url(#word)"/>
  <rect class="twinkle-a" width="1200" height="360" fill="url(#sparks-a)" mask="url(#word)"/>
  <rect class="twinkle-b" width="1200" height="360" fill="url(#sparks-b)" mask="url(#word)"/>

  <!-- rotating role in brackets -->
  <text class="mono tag red" x="40" y="318">[</text>
  <text class="mono tag role role-1" x="66" y="318">Bug hunter</text>
  <text class="mono tag role role-2" x="66" y="318">Pentester</text>
  <text class="mono tag role role-3" x="66" y="318">Red teamer</text>
  <text class="mono tag red" x="300" y="318">]</text>

  <text class="mono label" x="1160" y="318" text-anchor="end"><tspan class="red">AZ</tspan><tspan class="blink">_</tspan></text>
</svg>
